<script>
async function api(url,options={}){const r=await fetch(url,{credentials:"same-origin",...options,headers:{"Content-Type":"application/json",...(options.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.detail||"Požiadavka zlyhala.");return d}
function show(id,text){const e=document.getElementById(id);e.textContent=text;e.hidden=false}
async function loadStock(){
 const products=await api("/api/products"),box=document.getElementById("stock");box.replaceChildren();
 products.forEach(p=>{const row=document.createElement("div");row.className="row";const label=document.createElement("span");label.textContent=`${p.name} (${p.price.toFixed(2)} €) — sklad: ${p.stock} ks`;
 const form=document.createElement("form"),input=document.createElement("input");input.type="number";input.min="0";input.max="1000000";input.value=p.stock;input.required=true;input.setAttribute("aria-label","Nový stav skladu");
 const button=document.createElement("button");button.textContent="Uložiť sklad";form.append(input,button);
 form.addEventListener("submit",async e=>{e.preventDefault();try{const stock=Number(input.value);if(!Number.isInteger(stock)||stock<0)throw new Error("Zadaj platné číslo od 0.");await api(`/api/admin/products/${p.id}/stock`,{method:"POST",body:JSON.stringify({stock})});show("status","Sklad bol úspešne zmenený.");await loadStock()}catch(err){show("status",err.message)}});
 row.append(label,form);box.append(row)});
}
document.getElementById("loginForm").addEventListener("submit",async e=>{e.preventDefault();try{await api("/api/admin/login",{method:"POST",body:JSON.stringify({pin:document.getElementById("pin").value})});document.getElementById("login").classList.add("hidden");document.getElementById("panel").classList.remove("hidden");await loadStock()}catch(err){show("loginMessage",err.message)}});
document.getElementById("logout").addEventListener("click",async()=>{try{await api("/api/admin/logout",{method:"POST"});location.reload()}catch(e){show("status",e.message)}});
api("/api/admin/status").then(s=>{if(s.is_admin){document.getElementById("login").classList.add("hidden");document.getElementById("panel").classList.remove("hidden");loadStock().catch(e=>show("status",e.message))}}).catch(()=>{});
</script>
